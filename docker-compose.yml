services:
  qc-api:
    build: .
    image: fastq-qc-api:latest
    ports:
      - "8000:8000"
    environment:
      QC_DATA_DIR: /data
      # Optional: cap each uploaded file (bytes). Defaults to 20 GiB.
      QC_MAX_UPLOAD_BYTES: "21474836480"
    volumes:
      - qc-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  qc-data:
